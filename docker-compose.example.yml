services:
  subscriber:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      SUPABASE_URL: https://your-project.supabase.co
      SUPABASE_PUBLISHABLE_KEY: replace-with-publishable-key
      ORIGIN: http://localhost:3000
      BODY_SIZE_LIMIT: 524288
      PROVIDER_COST_CACHE_MINUTES: 60
      # OPENAI_ADMIN_KEY:
      # ANTHROPIC_ADMIN_KEY:
      # XAI_MANAGEMENT_KEY:
